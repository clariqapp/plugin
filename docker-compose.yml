services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uwordpress", "-pwordpress"]
      interval: 5s
      timeout: 5s
      retries: 10

  wordpress:
    image: wordpress:6.7-php8.2-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8888:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('SCRIPT_DEBUG', true);
        define('WC_MCP_CLARIQ_SIGNING_KEY', '${WC_MCP_CLARIQ_SIGNING_KEY:-}');
    volumes:
      - wp_data:/var/www/html
      - ./:/var/www/html/wp-content/plugins/wc-analytics-mcp
      - ./docker/install.sh:/docker-entrypoint-init.d/install.sh

  wpcli:
    image: wordpress:cli-php8.2
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('SCRIPT_DEBUG', true);
        define('WC_MCP_CLARIQ_SIGNING_KEY', '${WC_MCP_CLARIQ_SIGNING_KEY:-}');
    volumes:
      - wp_data:/var/www/html
      - ./:/var/www/html/wp-content/plugins/wc-analytics-mcp
      - ./docker/setup.sh:/setup.sh
    entrypoint: /setup.sh
    user: "33:33"

volumes:
  db_data:
  wp_data:
