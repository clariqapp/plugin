name: Draft plugin release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json
      - name: Install locked admin dependencies
        run: npm ci --prefix admin-ui
      - name: Require a matching version tag
        run: |
          expected="${GITHUB_REF_NAME#v}"
          python3 scripts/verify_version.py --expected "$expected"
      - name: Build, package, and inspect release artifact
        run: npm run release:build
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG: gitleaks.toml
      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: |
            dist/clariq-analytics-mcp.zip
            dist/clariq-analytics-mcp.zip.sha256
            dist/clariq-analytics-mcp-*.zip
            dist/clariq-analytics-mcp-*.zip.sha256
          if-no-files-found: error

  draft-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: dist
      - name: Create draft release from verified artifact
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/clariq-analytics-mcp.zip
            dist/clariq-analytics-mcp.zip.sha256
            dist/clariq-analytics-mcp-*.zip
            dist/clariq-analytics-mcp-*.zip.sha256
